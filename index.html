<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>7 Meter Turnier – TV Spaichingen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-app-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
  :root {
    --bg: #F6F4EE; --ink: #1E2321; --sub: #5B6560; --surface: #FFFFFF;
    --line: #DDD9CC; --teal: #0F6E56; --tealDeep: #085041; --tealPale: #E1F0EA;
    --gold: #BA7517; --goldPale: #FAEEDA; --red: #A32D2D;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Inter', sans-serif; background: var(--bg); color: var(--ink); }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 24px 16px 60px; }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand img { width: 56px; height: 56px; object-fit: contain; flex-shrink: 0; }
  h1 { font-family: 'Anton', sans-serif; font-weight: 400; font-size: 28px; letter-spacing: 0.3px; margin: 0; line-height: 1.15; }
  h1 span { color: var(--teal); }
  .sub { margin: 2px 0 0; font-size: 13px; color: var(--sub); }
  .top { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
  .tabs { display: flex; gap: 4px; margin-bottom: 20px; border-bottom: 2px solid var(--line); flex-wrap: wrap; }
  .tab-btn { padding: 9px 14px; font-size: 14px; font-weight: 500; background: none; border: none; cursor: pointer; color: var(--sub); border-bottom: 2px solid transparent; margin-bottom: -2px; font-family: inherit; }
  .tab-btn.active { color: var(--tealDeep); border-bottom: 2px solid var(--teal); }
  .groups-row { display: flex; gap: 28px; flex-wrap: wrap; }
  .group-block { flex: 1; min-width: 300px; }
  .group-title { font-family: 'Anton', sans-serif; font-weight: 400; font-size: 22px; color: var(--teal); letter-spacing: 0.5px; margin: 0 0 4px; }
  .team-inputs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .team-inputs input { font-size: 12px; padding: 4px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); width: 110px; font-family: inherit; }
  table.standings { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; font-size: 13px; }
  table.standings th { font-size: 11px; font-weight: 600; color: var(--sub); text-transform: uppercase; letter-spacing: 0.4px; text-align: left; padding: 8px 8px; border-bottom: 1px solid var(--line); }
  table.standings td { padding: 8px 8px; border-bottom: 1px solid var(--line); }
  table.standings tr:last-child td { border-bottom: none; }
  table.standings tr.qualified { background: var(--tealPale); }
  .mono { font-family: 'IBM Plex Mono', monospace; }
  .round-label { font-size: 11px; font-weight: 600; color: var(--sub); text-transform: uppercase; letter-spacing: 0.4px; margin: 14px 0 6px; }
  .match-card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
  .match-teams { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; font-weight: 500; margin-bottom: 8px; }
  .match-teams .placeholder { color: var(--sub); font-style: italic; }
  .set-row { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .set-row .set-label { width: 44px; font-size: 11px; color: var(--sub); }
  .score-box { width: 40px; height: 32px; text-align: center; font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 14px; color: var(--ink); background: var(--bg); border: 1.5px solid var(--line); border-radius: 6px; outline: none; }
  .score-box:disabled { background: #EDEBE3; }
  .colon { color: var(--sub); font-size: 12px; }
  .status { display: inline-block; margin-top: 4px; font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 20px; }
  .status.win { background: var(--tealPale); color: var(--tealDeep); }
  .status.draw { background: var(--goldPale); color: var(--gold); }
  .status.pending { background: #F1EFE8; color: var(--sub); }
  .ko-section { margin-bottom: 30px; }
  .ko-section h3 { font-size: 13px; font-weight: 600; color: var(--gold); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; }
  .ko-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .ko-col { display: flex; flex-direction: column; gap: 10px; }
  .ko-col .match-card { margin-bottom: 0; min-width: 230px; }
  .arrow { color: var(--line); font-size: 18px; padding: 0 2px; }
  .final-table { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; max-width: 320px; }
  .final-row { display: flex; justify-content: space-between; padding: 7px 12px; font-size: 13px; border-bottom: 1px solid var(--line); }
  .final-row:last-child { border-bottom: none; }
  .final-row.top3 { background: var(--goldPale); }
  .final-row .name.empty { color: var(--sub); }
  table.allgames { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; font-size: 13px; }
  table.allgames th { font-size: 11px; font-weight: 600; color: var(--sub); text-transform: uppercase; letter-spacing: 0.4px; text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); }
  table.allgames td { padding: 8px 12px; border-bottom: 1px solid var(--line); }
  table.allgames tr:last-child td { border-bottom: none; }
  .conn { font-size: 11px; color: var(--sub); font-family: 'IBM Plex Mono', monospace; }
  .conn.err { color: var(--red); }
  .reset-btn { font-size: 12px; color: var(--sub); background: none; border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; cursor: pointer; font-family: inherit; }
  .setup-note { background: var(--goldPale); border: 1px solid var(--gold); border-radius: 10px; padding: 16px; font-size: 13px; line-height: 1.6; max-width: 600px; }
  .setup-note code { background: rgba(0,0,0,0.06); padding: 1px 5px; border-radius: 4px; font-family: 'IBM Plex Mono', monospace; font-size: 12px; }
  .overview-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px; }
  @media (max-width: 700px) { .overview-grid { grid-template-columns: 1fr; } }
  .overview-card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  .overview-card h3 { font-size: 13px; font-weight: 600; color: var(--gold); text-transform: uppercase; letter-spacing: 0.5px; margin: 0 0 12px; }
  .overview-item { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; padding: 7px 0; border-bottom: 1px solid var(--line); }
  .overview-item:last-child { border-bottom: none; }
  .overview-item .res { font-family: 'IBM Plex Mono', monospace; font-weight: 600; }
  .empty-note { font-size: 13px; color: var(--sub); font-style: italic; }
  .rotator-dots { display: flex; gap: 5px; margin-top: 10px; justify-content: center; }
  .rotator-dots span { width: 6px; height: 6px; border-radius: 50%; background: var(--line); }
  .rotator-dots span.active { background: var(--teal); }
  .share-box { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 24px; max-width: 420px; text-align: center; }
  .share-link { font-family: 'IBM Plex Mono', monospace; font-size: 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; word-break: break-all; margin: 12px 0; }
  .copy-btn { font-size: 12px; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--teal); background: var(--tealPale); color: var(--tealDeep); cursor: pointer; font-family: inherit; font-weight: 500; }
  .view-banner { background: var(--tealPale); color: var(--tealDeep); font-size: 12px; font-weight: 500; padding: 8px 12px; border-radius: 8px; margin-bottom: 16px; }
  .set-detail { font-family: 'IBM Plex Mono', monospace; font-weight: 400; font-size: 11px; color: var(--sub); margin-left: 4px; }
  .game-list { display: flex; flex-direction: column; gap: 8px; max-width: 560px; }
  .game-list-item { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; cursor: pointer; transition: border-color .15s; }
  .game-list-item:hover { border-color: var(--teal); }
  .glm-meta { font-size: 11px; color: var(--sub); text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 4px; }
  .glm-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .glm-teams { font-size: 14px; font-weight: 500; }
  .glm-vs { color: var(--sub); font-weight: 400; }
  .modal-overlay { position: fixed; inset: 0; background: rgba(30,35,33,0.45); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 16px; }
  .modal-box { background: var(--surface); border-radius: 14px; padding: 22px; width: 320px; max-width: 100%; }
  .modal-title { font-size: 15px; font-weight: 500; margin-bottom: 14px; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
  .sponsor-slide { display: flex; align-items: center; justify-content: center; height: 260px; width: 100%; }
  .sponsor-slide img { max-height: 100%; max-width: 100%; width: 100%; height: 100%; object-fit: contain; }
  .sponsor-thumb { position: relative; }
  .sponsor-thumb img { height: 40px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); padding: 4px; }
  .sponsor-thumb button { position: absolute; top: -6px; right: -6px; background: var(--red); color: #fff; border: none; border-radius: 50%; width: 16px; height: 16px; font-size: 10px; line-height: 1; cursor: pointer; }
  .bracket { display: flex; gap: 48px; align-items: stretch; margin-bottom: 20px; overflow-x: auto; padding-bottom: 8px; }
  .bracket-round { display: flex; flex-direction: column; justify-content: space-around; gap: 24px; flex: 1; min-width: 220px; }
  .bracket-pair { display: flex; flex-direction: column; justify-content: space-around; gap: 24px; position: relative; flex: 1; }
  .bracket-pair:not(.single)::after { content: ""; position: absolute; top: 25%; bottom: 25%; right: -24px; width: 24px; border-top: 1.5px solid var(--line); border-right: 1.5px solid var(--line); border-bottom: 1.5px solid var(--line); border-radius: 0 6px 6px 0; }
  .bracket-round-title { font-size: 12px; font-weight: 600; color: var(--gold); text-transform: uppercase; letter-spacing: 0.4px; text-align: center; margin-bottom: 12px; }
  .phase-section { margin-bottom: 34px; }
  .phase-title { font-family: 'Anton', sans-serif; font-weight: 400; font-size: 20px; color: var(--teal); letter-spacing: 0.4px; margin: 0 0 16px; }
  .subtabs { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
  .subtab-btn { padding: 8px 16px; font-size: 13px; font-weight: 500; border-radius: 20px; border: 1px solid var(--line); background: var(--surface); color: var(--sub); cursor: pointer; font-family: inherit; }
  .subtab-btn.active { background: var(--teal); color: #fff; border-color: var(--teal); }
  .game-list-item.disabled { cursor: default; opacity: 0.65; }
  .game-list-item.disabled:hover { border-color: var(--line); }
  .glm-teams.placeholder { font-style: italic; color: var(--sub); }
  .site-footer { margin-top: 40px; padding-top: 16px; border-top: 1px solid var(--line); text-align: center; }
  .footer-link { background: none; border: none; color: var(--sub); text-decoration: underline; cursor: pointer; font-size: 12px; font-family: inherit; padding: 0; }
  .legal-text { font-size: 13px; line-height: 1.6; color: var(--ink); }
  .legal-text p { margin: 0 0 10px; }
  .legal-text a { color: var(--tealDeep); }
  .override-box { background: var(--goldPale); border: 1px solid var(--gold); border-radius: 8px; padding: 10px 12px; margin-top: 10px; }
  .override-label { font-size: 11px; font-weight: 600; color: var(--gold); text-transform: uppercase; letter-spacing: 0.4px; margin: 0 0 6px; }
  .override-select { width: 100%; padding: 6px 8px; font-size: 13px; border-radius: 6px; border: 1px solid var(--line); font-family: inherit; margin-bottom: 6px; background: var(--surface); }
  .override-badge { display: inline-block; font-size: 10px; font-weight: 600; color: var(--gold); background: var(--goldPale); border-radius: 10px; padding: 2px 7px; margin-left: 6px; vertical-align: middle; }
</style>

function handleSponsorUpload(inputEl) {
  if (VIEW_ONLY) return;
  if (!requireAdmin()) return;
  const file = inputEl.files && inputEl.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      const maxW = 320;
      const scale = Math.min(1, maxW / img.width);
      const canvas = document.createElement("canvas");
      canvas.width = Math.round(img.width * scale);
      canvas.height = Math.round(img.height * scale);
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      const dataUrl = canvas.toDataURL("image/png");
      state.sponsors = [...(state.sponsors || []), { id: "sp" + Date.now(), src: dataUrl }];
      persist(); render();
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
  inputEl.value = "";
}

function generateRoundRobin(ids) {
  const n = ids.length, numRounds = n - 1, half = n / 2, rounds = [];
  let list = ids.slice();
  for (let r = 0; r < numRounds; r++) {
    const pairs = [];
    for (let i = 0; i < half; i++) pairs.push([list[i], list[list.length - 1 - i]]);
    rounds.push(pairs);
    const fixed = list[0], rest = list.slice(1);
    rest.unshift(rest.pop());
    list = [fixed, ...rest];
  }
  return rounds;
}

function getSets(res) {
  const sets = (res && res.sets) || [];
  return [sets[0] || {}, sets[1] || {}, sets[2] || {}];
}
function setResult(s) {
  if (!s || s.home == null || s.away == null) return null;
  if (s.home === s.away) return "tie";
  return s.home > s.away ? "home" : "away";
}
function matchOutcome(sets, allowDraw) {
  const r = [setResult(sets[0]), setResult(sets[1]), setResult(sets[2])];
  let home = 0, away = 0, entered = 0;
  for (let i = 0; i < 3; i++) {
    if (r[i] == null) break;
    entered++;
    if (r[i] === "home") home++;
    else if (r[i] === "away") away++;
    if (home >= 2) return { status: "win", winner: "home", setsHome: home, setsAway: away };
    if (away >= 2) return { status: "win", winner: "away", setsHome: home, setsAway: away };
  }
  if (entered < 2) return { status: "unstarted", setsHome: home, setsAway: away };
  if (entered < 3) return { status: "pending", setsHome: home, setsAway: away };
  if (home > away) return { status: "win", winner: "home", setsHome: home, setsAway: away };
  if (away > home) return { status: "win", winner: "away", setsHome: home, setsAway: away };
  if (allowDraw) return { status: "draw", setsHome: home, setsAway: away };
  return { status: "pending", tiedDecider: true, setsHome: home, setsAway: away };
}

function computeStandings(games, teams, results) {
  const table = {};
  teams.forEach(t => table[t.id] = { team: t, sp: 0, s: 0, u: 0, n: 0, setsW: 0, setsL: 0, pkt: 0 });
  games.forEach(g => {
    const outcome = matchOutcome(getSets(results[g.id]), true);
    if (outcome.status !== "win" && outcome.status !== "draw") return;
    const home = table[g.home], away = table[g.away];
    home.sp++; away.sp++;
    home.setsW += outcome.setsHome; home.setsL += outcome.setsAway;
    away.setsW += outcome.setsAway; away.setsL += outcome.setsHome;
    if (outcome.status === "win") {
      if (outcome.winner === "home") { home.s++; away.n++; home.pkt += 2; }
      else { away.s++; home.n++; away.pkt += 2; }
    } else { home.u++; away.u++; home.pkt += 1; away.pkt += 1; }
  });
  return Object.values(table).sort((a, b) => {
    if (b.pkt !== a.pkt) return b.pkt - a.pkt;
    const diffA = a.setsW - a.setsL, diffB = b.setsW - b.setsL;
    if (diffB !== diffA) return diffB - diffA;
    if (b.setsW !== a.setsW) return b.setsW - a.setsW;
    return a.team.name.localeCompare(b.team.name);
  });
}

function getTeamsByGroup(g) { return state.teams.filter(t => t.group === g); }
function teamsById() { return Object.fromEntries(state.teams.map(t => [t.id, t])); }

function resolveAll(standingsA, standingsB) {
  const memo = {};
  function resolveSource(src) {
    if (!src) return null;
    if (src.type === "standing") {
      const table = src.group === "A" ? standingsA : standingsB;
      return (table[src.pos - 1] || {}).team || null;
    }
    const r = resolveGame(src.game);
    return src.type === "winner" ? r.winner : r.loser;
  }
  function resolveGame(id) {
    if (memo[id]) return memo[id];
    const g = koById[id];
    const pairingOverride = (state.koOverrides && state.koOverrides.pairings && state.koOverrides.pairings[id]) || {};
    const tById = teamsById();
    const home = pairingOverride.home ? (tById[pairingOverride.home] || null) : resolveSource(g.home);
    const away = pairingOverride.away ? (tById[pairingOverride.away] || null) : resolveSource(g.away);
    const allowDraw = false;
    const outcome = matchOutcome(getSets(state.koResults[id]), allowDraw);
    const winnerOverride = state.koOverrides && state.koOverrides.winners && state.koOverrides.winners[id];
    let winner = null, loser = null, overridden = false;
    if (winnerOverride && home && away) {
      winner = winnerOverride === "home" ? home : away;
      loser = winnerOverride === "home" ? away : home;
      overridden = true;
    } else if (home && away && outcome.status === "win") {
      winner = outcome.winner === "home" ? home : away;
      loser = outcome.winner === "home" ? away : home;
    }
    memo[id] = { home, away, winner, loser, outcome, overridden, pairingOverridden: !!(pairingOverride.home || pairingOverride.away) };
    return memo[id];
  }
  KO_GAMES.forEach(g => resolveGame(g.id));
  return memo;
}

function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;"); }
function fieldLabel(g) { return g === "A" ? "Platz 1" : "Platz 2"; }
function hasAnyGroupResult() {
  return Object.keys(state.groupResults).some(k => {
    const sets = getSets(state.groupResults[k]);
    return sets.some(s => s.home != null || s.away != null);
  });
}
function shuffleGroups() {
  if (VIEW_ONLY) return;
  if (hasAnyGroupResult()) return;
  if (!requireAdmin()) return;
  if (!confirm("Teams werden zufällig neu auf Platz 1 und Platz 2 verteilt. Fortfahren?")) return;
  const names = state.teams.map(t => t.name);
  for (let i = names.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [names[i], names[j]] = [names[j], names[i]];
  }
  state.teams = state.teams.map((t, i) => ({ ...t, name: names[i] }));
  persist(); render();
}

function renderStandingsTable(rows, highlightUpTo) {
  return `<table class="standings"><thead><tr><th>#</th><th>Team</th><th>Sp</th><th>S</th><th>U</th><th>N</th><th>Sätze</th><th>Diff</th><th>Pkt</th></tr></thead><tbody>` +
    rows.map((r, i) => `<tr class="${i < highlightUpTo ? 'qualified' : ''}">
      <td class="mono">${i + 1}</td><td>${esc(r.team.name)}</td><td class="mono">${r.sp}</td><td>${r.s}</td><td>${r.u}</td><td>${r.n}</td>
      <td class="mono">${r.setsW}:${r.setsL}</td><td class="mono">${r.setsW - r.setsL > 0 ? '+' : ''}${r.setsW - r.setsL}</td><td class="mono">${r.pkt}</td>

function renderMatchCard(resultsKey, id, homeLabel, awayLabel, ready, allowDraw) {
  const res = state[resultsKey][id];
  const sets = getSets(res);
  const outcome = matchOutcome(sets, allowDraw);
  const r1 = setResult(sets[0]), r2 = setResult(sets[1]);
  const showSet3 = ready && outcome.status === "pending" && !outcome.tiedDecider;

  let statusHtml = "";
  if (!ready) statusHtml = `<span class="status pending">wartet auf Teilnehmer</span>`;
  else if (outcome.status === "unstarted") statusHtml = `<span class="status pending">ausstehend</span>`;
  else if (outcome.status === "win") statusHtml = `<span class="status win">${outcome.setsHome}:${outcome.setsAway} Sätze — Sieg ${outcome.winner === "home" ? esc(homeLabel) : esc(awayLabel)}</span>`;
  else if (outcome.status === "draw") statusHtml = `<span class="status draw">Unentschieden — 1 Punkt für beide</span>`;
  else if (outcome.tiedDecider) statusHtml = `<span class="status pending">Kein eindeutiger Sieger nach 3 Sätzen (${outcome.setsHome}:${outcome.setsAway}) — bitte Ergebnisse prüfen</span>`;
  else statusHtml = `<span class="status pending">${outcome.setsHome}:${outcome.setsAway} nach Sätzen — Satz 3 nötig</span>`;

  function setRow(i) {
    const s = sets[i] || {};
    const dis = (ready ? "" : "disabled") || RO;
    return `<div class="set-row">
      <span class="set-label">Satz ${i + 1}</span>
      <input class="score-box" type="number" min="0" value="${s.home ?? ''}" ${dis} onchange="updateSetScore('${resultsKey}','${id}',${i},'home',this.value)">
      <span class="colon">:</span>
      <input class="score-box" type="number" min="0" value="${s.away ?? ''}" ${dis} onchange="updateSetScore('${resultsKey}','${id}',${i},'away',this.value)">
    </div>`;
  }

  return `<div class="match-card">
    <div class="match-teams"><span class="${ready ? '' : 'placeholder'}">${esc(homeLabel)}</span><span class="${ready ? '' : 'placeholder'}">${esc(awayLabel)}</span></div>
    ${setRow(0)}${setRow(1)}${showSet3 ? setRow(2) : ""}
    ${statusHtml}
  </div>`;
}

function buildGroupSchedule(roundsA, roundsB) {
  const list = [];
  const perRoundA = roundsA[0] ? roundsA[0].length : 0;
  const perRoundB = roundsB[0] ? roundsB[0].length : 0;
  const maxRounds = Math.max(roundsA.length, roundsB.length);
  for (let r = 0; r < maxRounds; r++) {
    const ga = roundsA[r] || [], gb = roundsB[r] || [];
    const maxGames = Math.max(ga.length, gb.length);
    for (let gi = 0; gi < maxGames; gi++) {
      if (ga[gi]) list.push({ id: `A-${r * perRoundA + gi}`, home: ga[gi][0], away: ga[gi][1], field: fieldLabel("A") });
      if (gb[gi]) list.push({ id: `B-${r * perRoundB + gi}`, home: gb[gi][0], away: gb[gi][1], field: fieldLabel("B") });
    }
  }
  return list;
}

function buildTournamentData() {
  const teamsA = getTeamsByGroup("A"), teamsB = getTeamsByGroup("B");
  const roundsA = generateRoundRobin(teamsA.map(t => t.id));
  const roundsB = generateRoundRobin(teamsB.map(t => t.id));
  const flatGamesA = roundsA.flat().map((pair, i) => ({ id: `A-${i}`, home: pair[0], away: pair[1] }));
  const flatGamesB = roundsB.flat().map((pair, i) => ({ id: `B-${i}`, home: pair[0], away: pair[1] }));
  const standingsA = computeStandings(flatGamesA, teamsA, state.groupResults);
  const standingsB = computeStandings(flatGamesB, teamsB, state.groupResults);
  const resolved = resolveAll(standingsA, standingsB);
  const groupSchedule = buildGroupSchedule(roundsA, roundsB);
  const gameNumbers = {};
  groupSchedule.forEach((g, i) => { gameNumbers[g.id] = i + 1; });
  KO_GAMES.forEach((g, i) => { gameNumbers[g.id] = groupSchedule.length + i + 1; });
  return { teamsA, teamsB, roundsA, roundsB, flatGamesA, flatGamesB, standingsA, standingsB, resolved, groupSchedule, gameNumbers };
}

    return "–:–";
  }
  const done = rows.filter(g => g.outcome.status === "win" || g.outcome.status === "draw").length;
  return `<p class="sub" style="margin-bottom:14px">${done} von ${rows.length} Spielen eingetragen</p><table class="allgames"><thead><tr><th>Nr.</th><th>Phase</th><th>Begegnung</th><th>Sätze</th></tr></thead><tbody>` +
    rows.map(g => `<tr><td class="mono">${gameNumbers[g.id]}</td><td style="color:var(--sub)">${esc(g.phase)}</td><td>${esc(g.home)} <span style="color:var(--sub)">–</span> ${esc(g.away)}</td>
      <td class="mono" style="font-weight:600">${outcomeText(g.outcome)}</td></tr>`).join("") +
    `</tbody></table>`;
}

function renderTeilen() {
  const base = window.location.href.split("?")[0];
  const link = base + "?view=1";
  const qr = `https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=${encodeURIComponent(link)}`;
  return `<div class="share-box">
    <p class="sub" style="margin-bottom:12px">Diesen Link an die Teams weitergeben — nur zum Ansehen, keine Eingabe möglich.</p>
    <img src="${qr}" alt="QR-Code zum Teilen" width="220" height="220" style="border-radius:8px">
    <div class="share-link" id="share-link-text">${esc(link)}</div>
    <button class="copy-btn" onclick="copyShareLink('${link.replace(/'/g, "\\'")}')">Link kopieren</button>
    <p class="sub" style="margin-top:14px">Funktioniert nur, sobald die Seite unter einer echten Web-Adresse liegt (z. B. über GitHub Pages) — nicht bei einer lokal geöffneten Datei. Für live geteilte Ergebnisse über mehrere Geräte wird zusätzlich die Firebase-Verbindung benötigt.</p>
  </div>`;
}

function renderArchiv() {
  const years = Object.keys(state.archive || {}).sort((a, b) => b.localeCompare(a, undefined, { numeric: true }));
  if (!years.length) {
    return `<p class="empty-note">Noch keine archivierten Saisons vorhanden. Über den Button "Turnier archivieren" im Reiter "Ergebnisse eintragen" wird die aktuelle Saison hier gespeichert.</p>`;
  }
  if (!archiveSelectedYear || !years.includes(archiveSelectedYear)) archiveSelectedYear = years[0];
  let html = `<div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px;margin-bottom:20px">
    <div style="display:flex;gap:8px;flex-wrap:wrap">` +
    years.map(y => `<button class="tab-btn ${y === archiveSelectedYear ? 'active' : ''}" onclick="selectArchiveYear('${y}')">${esc(y)}</button>`).join("") +
    `</div>
    ${!VIEW_ONLY ? `<button class="reset-btn" onclick="deleteArchiveYear('${archiveSelectedYear}')">Saison ${esc(archiveSelectedYear)} löschen</button>` : ""}
  </div>` + renderArchivedSeason(archiveSelectedYear);
  return html;
}
function selectArchiveYear(y) { archiveSelectedYear = y; render(); }
function deleteArchiveYear(year) {
  if (VIEW_ONLY) return;
  if (!requireAdmin()) return;
  if (!confirm(`Archivierte Saison ${year} wirklich unwiderruflich löschen?`)) return;
  delete state.archive[year];
  archiveSelectedYear = null;
  persist(); render();
}

function renderArchivedSeason(year) {
  const snap = state.archive[year];
  if (!snap) return "";
  const tableRows = grp => grp.map(r => ({ team: { name: r.name }, sp: r.sp, s: r.s, u: r.u, n: r.n, setsW: r.setsW, setsL: r.setsL, pkt: r.pkt }));
  let html = `<div class="groups-row">
    <div class="group-block"><h2 class="group-title">${fieldLabel("A")}</h2>${renderStandingsTable(tableRows(snap.groups.A), 4)}</div>
    <div class="group-block"><h2 class="group-title">${fieldLabel("B")}</h2>${renderStandingsTable(tableRows(snap.groups.B), 4)}</div>
  </div>`;
  if (snap.groupGames && snap.groupGames.length) {
    html += `<div class="phase-section" style="margin-top:24px"><h2 class="phase-title">Gruppenspiele</h2><table class="allgames"><thead><tr><th>Nr.</th><th>Platz</th><th>Begegnung</th><th>Sätze</th></tr></thead><tbody>` +
      snap.groupGames.map(g => `<tr><td class="mono">${g.number}</td><td style="color:var(--sub)">${esc(g.phase)}</td><td>${esc(g.home)} <span style="color:var(--sub)">–</span> ${esc(g.away)}</td>
        <td class="mono" style="font-weight:600">${esc(g.result)}${g.sets ? ` <span class="set-detail">(${esc(g.sets)})</span>` : ""}</td></tr>`).join("") +
      `</tbody></table></div>`;
  }
  const byId = Object.fromEntries(snap.bracket.map(g => [g.id, g]));
  const card = id => {
    const g = byId[id];
    if (!g) return `<div class="match-card"><div class="match-teams"><span class="placeholder">unbekannt</span></div></div>`;
    return `<div class="match-card">
      <div class="match-teams"><span>${esc(g.home)}</span><span>${esc(g.away)}</span></div>
      <span class="status ${g.result === '–:–' ? 'pending' : 'win'}">${esc(g.result)}</span>
      ${g.sets ? `<div class="set-detail" style="margin-top:4px">(${esc(g.sets)})</div>` : ""}
    </div>`;
  };
  const rawStructure = snap.bracketStructure;
  const structure = !rawStructure ? LIVE_BRACKET_STRUCTURE : (rawStructure.koPhase ? rawStructure : { koPhase: rawStructure });
  html += `<div style="margin-top:24px">${renderStructuredBracket(structure, card)}</div>`;
  html += `<div class="phase-section"><h2 class="phase-title">Endstand</h2><div class="final-table" style="max-width:360px">` +
    snap.placements.map(p => `<div class="final-row ${p.rank <= 3 ? 'top3' : ''}"><span class="mono">${p.rank}.</span><span class="name ${p.name ? '' : 'empty'}">${p.name ? esc(p.name) : 'wird ermittelt'}</span></div>`).join("") +
    `</div></div>`;
  return html;
}

function buildArchiveSnapshot() {
  const data = buildTournamentData();
  const slimStandings = rows => rows.map(r => ({ name: r.team.name, sp: r.sp, s: r.s, u: r.u, n: r.n, setsW: r.setsW, setsL: r.setsL, pkt: r.pkt }));
  const bracketStructure = JSON.parse(JSON.stringify(LIVE_BRACKET_STRUCTURE));
  const bracket = KO_GAMES.map(g => {
    const r = data.resolved[g.id];
    const ready = !!r.home && !!r.away;
    const sets = getSets(state.koResults[g.id]);
    const setsText = sets.filter(s => s.home != null && s.away != null).map(s => `${s.home}:${s.away}`).join(", ");
    let result = "–:–";
    if (r.overridden) result = `Sieger manuell: ${r.winner.name}`;
    else if (r.outcome.status === "win") result = `${r.outcome.setsHome}:${r.outcome.setsAway}`;
    return { id: g.id, phase: g.phase, home: ready ? r.home.name : sourceLabel(g.home), away: ready ? r.away.name : sourceLabel(g.away), result, sets: setsText };
  });
  const groupGames = data.groupSchedule.map(g => {
    const res = state.groupResults[g.id];
    const sets = getSets(res);
    const outcome = matchOutcome(sets, true);
    const setsText = sets.filter(s => s.home != null && s.away != null).map(s => `${s.home}:${s.away}`).join(", ");
    let result = "–:–";
    if (outcome.status === "win") result = `${outcome.setsHome}:${outcome.setsAway}`;
    else if (outcome.status === "draw") result = `${outcome.setsHome}:${outcome.setsAway} (unentschieden)`;
    return { id: g.id, number: data.gameNumbers[g.id], phase: g.field, home: teamsById()[g.home].name, away: teamsById()[g.away].name, result, sets: setsText };
  });
  const placesFinal = [
    [1, data.resolved.FINALE.winner], [2, data.resolved.FINALE.loser],
    [3, data.resolved.P3.winner], [4, data.resolved.P3.loser],
    [5, data.resolved.P5.winner], [6, data.resolved.P5.loser],
    [7, data.resolved.P7.winner], [8, data.resolved.P7.loser],
    [9, data.resolved.P9.winner], [10, data.resolved.P9.loser],
    [11, data.resolved.P11.winner], [12, data.resolved.P11.loser],
  ];
  const placements = placesFinal.map(([rank, team]) => ({ rank, name: team ? team.name : null }));
  return { groups: { A: slimStandings(data.standingsA), B: slimStandings(data.standingsB) }, groupGames, bracket, bracketStructure, placements };
}

function archiveSeason() {
  if (VIEW_ONLY) return;
  if (!requireAdmin()) return;
  const suggested = new Date().getFullYear();
  const year = prompt("Für welches Jahr soll die aktuelle Saison archiviert werden?", String(suggested));
  if (!year || !year.trim()) return;
  if (!confirm(`Saison ${year.trim()} wird archiviert. Alle aktuellen Ergebnisse und Teamnamen werden danach für eine neue Saison zurückgesetzt. Fortfahren?`)) return;
  state.archive = state.archive || {};
  state.archive[year.trim()] = buildArchiveSnapshot();
  state.teams = defaultTeams();
  state.groupResults = {};
  state.koResults = {};
  state.koOverrides = { pairings: {}, winners: {} };
  persist(); render();
}

function render() {
  const root = document.getElementById("root");
  if (connStatus === "error") {
    root.innerHTML = `<h1>7 Meter Turnier – <span>TV Spaichingen</span></h1>
      <div class="setup-note" style="margin-top:16px;border-color:var(--red);background:#FCEBEB;color:var(--red)">
        Verbindung zur Datenbank fehlgeschlagen. Bitte prüft die Werte in <code>firebaseConfig</code> und die Zugriffsregeln der Realtime Database.
      </div>`;
    return;
  }
  if (!state) { root.innerHTML = `<p class="sub">Lädt…</p>`; return; }
  if (VIEW_ONLY && state.tab === "ergebnisse") state.tab = "uebersicht";

  const data = buildTournamentData();
  let content = "";
  if (state.tab === "uebersicht") content = renderUebersicht(data);
  else if (state.tab === "gruppen") {
    content = `${!VIEW_ONLY && !hasAnyGroupResult() ? `<div style="margin-bottom:16px"><button class="copy-btn" onclick="shuffleGroups()">Gruppen mischen</button><p class="sub" style="margin-top:6px">Verteilt die Teams zufällig auf Platz 1 und Platz 2. Nur möglich, solange noch kein Ergebnis eingetragen wurde.</p></div>` : ""}<div class="groups-row">
      ${renderGroupStandingsBlock("A", data.teamsA, data.standingsA)}
      ${renderGroupStandingsBlock("B", data.teamsB, data.standingsB)}
    </div>`;
  } else if (state.tab === "ergebnisse" && !VIEW_ONLY) {
    content = `<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px">
        <button class="reset-btn" onclick="archiveSeason()">Turnier archivieren</button>
        ${ergebnisseSubTab === "gruppen" ? `<button class="reset-btn" onclick="generateRefereePdf()">Schiedsrichterzettel als PDF</button>` : ""}
      </div>
      <div class="subtabs">
        <button class="subtab-btn ${ergebnisseSubTab === 'gruppen' ? 'active' : ''}" onclick="setErgebnisseSubTab('gruppen')">Gruppenphase</button>
        <button class="subtab-btn ${ergebnisseSubTab === 'ko' ? 'active' : ''}" onclick="setErgebnisseSubTab('ko')">K.-o.-Phase + Platzierung</button>
      </div>
      ${ergebnisseSubTab === "ko" ? renderErgebnisseKoList(data) : renderErgebnisseList(data)}`;
  } else if (state.tab === "baum") content = renderBaum(id => renderKoCardReadonly(id, data.resolved));
  else if (state.tab === "alle") content = renderAlle(data);
  else if (state.tab === "endstand") content = renderEndstand(data);
  else if (state.tab === "archiv") content = renderArchiv();
  else if (state.tab === "teilen") content = renderTeilen();

  const connLabel = connStatus === "connected" ? "verbunden · live synchronisiert" : connStatus === "local" ? "lokal gespeichert (nur dieses Gerät)" : "verbinde…";
  const tabs = [["uebersicht", "Übersicht"], ["gruppen", "Gruppen"]];
  if (!VIEW_ONLY) tabs.push(["ergebnisse", "Ergebnisse eintragen"]);
  tabs.push(["baum", "Turnierbaum"], ["alle", "Alle Spiele"], ["endstand", "Endstand"], ["archiv", "Archiv"]);
  if (!VIEW_ONLY) tabs.push(["teilen", "Teilen"]);

  root.innerHTML = `
    ${VIEW_ONLY ? `<div class="view-banner">Ansichtsmodus — Ergebnisse können hier nicht bearbeitet werden</div>` : ""}
    <div class="top">
      <div class="brand">
        <img src="${LOGO_SRC}" alt="TV Spaichingen Vereinswappen">
        <div>
          <h1>7 Meter Turnier – <span>TV Spaichingen</span></h1>
        </div>
      </div>
      <div style="text-align:right">
        <div class="conn ${connStatus === 'error' ? 'err' : ''}">${connLabel}</div>
        ${VIEW_ONLY ? "" : `<button class="reset-btn" style="margin-top:6px" onclick="resetAll()">Alles zurücksetzen</button>`}
      </div>
    </div>
    <div class="tabs">${tabs.map(([id, label]) => `<button class="tab-btn ${state.tab === id ? 'active' : ''}" onclick="setTab('${id}')">${label}</button>`).join("")}</div>
    ${content}
    <div class="site-footer">
      <button class="footer-link" onclick="openLegal('impressum')">Impressum</button> · <button class="footer-link" onclick="openLegal('datenschutz')">Datenschutz</button>
    </div>
    ${renderModal()}
    ${renderLegalModal()}
  `;
}

/* ---------- mutation handlers ---------- */
let dbRef = null;
function normalizeKoOverrides(ko) {
  return { pairings: (ko && ko.pairings) || {}, winners: (ko && ko.winners) || {} };
}

function persist() {
  if (VIEW_ONLY || !state) return;
  const payload = { teams: state.teams, groupResults: state.groupResults, koResults: state.koResults, koOverrides: normalizeKoOverrides(state.koOverrides), sponsors: state.sponsors || [], archive: state.archive || {} };
  try {
    if (dbRef) {
      dbRef.set(payload).catch(() => { connStatus = "error"; render(); });
    } else {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
    }
  } catch (e) {
    connStatus = "error";
  }
}
function updateSetScore(resultsKey, id, setIdx, side, val) {
  if (VIEW_ONLY) return;
  if (!requireAdmin()) { render(); return; }
  const n = val === "" ? null : Math.max(0, parseInt(val, 10) || 0);
  const cur = state[resultsKey][id] || {};
  const sets = getSets(cur);
  sets[setIdx] = { ...sets[setIdx], [side]: n };
  state[resultsKey][id] = { sets, updatedAt: Date.now() };
  persist(); render();
}
function updateTeamName(id, name) {
  if (VIEW_ONLY) return;
  if (!requireAdmin()) { render(); return; }
  state.teams = state.teams.map(t => t.id === id ? { ...t, name } : t);
  persist(); render();
}
let modalGame = null;
function openMatchModal(resultsKey, id, homeLabel, awayLabel, allowDraw) {
  if (VIEW_ONLY) return;
  if (!requireAdmin()) return;
  modalGame = { resultsKey, id, homeLabel, awayLabel, allowDraw };
  render();
  const el = document.getElementById("modal-s0h");
  if (el) el.focus();
}
function saveModal() {
  if (!modalGame) return;
  try {
    const { resultsKey, id } = modalGame;
    const sets = [0, 1, 2].map(i => {
      const h = document.getElementById(`modal-s${i}h`).value;
      const a = document.getElementById(`modal-s${i}a`).value;
      return { home: h === "" ? null : Math.max(0, parseInt(h, 10) || 0), away: a === "" ? null : Math.max(0, parseInt(a, 10) || 0) };
    });
    state[resultsKey][id] = { sets, updatedAt: Date.now() };
    if (resultsKey === "koResults") {
      const homeOverride = document.getElementById("modal-override-home").value;
      const awayOverride = document.getElementById("modal-override-away").value;
      const winnerOverride = document.getElementById("modal-override-winner").value;
      state.koOverrides = normalizeKoOverrides(state.koOverrides);
      if (homeOverride || awayOverride) {
        const p = {};
        if (homeOverride) p.home = homeOverride;
        if (awayOverride) p.away = awayOverride;
        state.koOverrides.pairings[id] = p;
      } else {
        delete state.koOverrides.pairings[id];
      }
      if (winnerOverride) state.koOverrides.winners[id] = winnerOverride;
      else delete state.koOverrides.winners[id];
    }
  } catch (e) {
    console.error("Fehler beim Speichern:", e);
  } finally {
    modalGame = null;
    persist();
    render();
  }
}
function cancelModal() { modalGame = null; render(); }
function handleModalKeydown(e) {
  if (!modalGame) return;
  if (e.key === "Escape") { e.preventDefault(); cancelModal(); return; }
  if (e.key === "Enter" && e.target && e.target.tagName !== "SELECT") {
    e.preventDefault();
    saveModal();
  }
}
document.addEventListener("keydown", handleModalKeydown);
function setTab(tab) { state.tab = tab; render(); }
function resetAll() {
  if (VIEW_ONLY) return;
  if (!requireAdmin()) return;
  if (!confirm("Wirklich alle Ergebnisse und Teamnamen zurücksetzen?")) return;
  state = { ...state, teams: defaultTeams(), groupResults: {}, koResults: {}, koOverrides: { pairings: {}, winners: {} } };
  persist(); render();
}
function generateRefereePdf() {
  if (!window.jspdf) { alert("PDF-Bibliothek konnte nicht geladen werden (keine Internetverbindung?)."); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: "pt", format: "a4" });
  const data = buildTournamentData();
  const tById = teamsById();
  const games = data.groupSchedule.map(g => ({ number: data.gameNumbers[g.id], field: g.field, home: tById[g.home].name, away: tById[g.away].name }));

  const marginX = 40;
  const perPage = 4;
  let y = 40;
  let count = 0;

  games.forEach(g => {
    if (count === perPage) { doc.addPage(); y = 40; count = 0; }
    doc.setFontSize(10);
    doc.setFont(undefined, "bold");
    doc.text(`Spiel ${g.number} · ${g.field}`, marginX, y);

    const body = [
      [{ content: "1", rowSpan: 2 }, g.home, "", "", "", "", "", ""],
      [g.away, "", "", "", "", "", ""],
      [{ content: "2", rowSpan: 2 }, g.home, "", "", "", "", "", ""],
      [g.away, "", "", "", "", "", ""],
      [{ content: "3", rowSpan: 2 }, g.home, "", "", "", "", "", ""],
      [g.away, "", "", "", "", "", ""],
    ];

    doc.autoTable({
      startY: y + 6,
      margin: { left: marginX, right: marginX },
      head: [["Satz", "Team", "Werfer 1", "Werfer 2", "Werfer 3", "Werfer 4", "Werfer 5", "Anzahl getroffene"]],
      body,
      theme: "grid",
      styles: { fontSize: 8, cellPadding: 4, valign: "middle", lineColor: [180, 178, 169], lineWidth: 0.5 },
      headStyles: { fillColor: [211, 209, 199], textColor: [30, 35, 33], fontStyle: "bold" },
      columnStyles: { 0: { cellWidth: 26, halign: "center" }, 1: { cellWidth: 90 } },
    });

    y = doc.lastAutoTable.finalY + 26;
    count++;
  });

  doc.save("schiedsrichterzettel-gruppenphase.pdf");
}

function copyShareLink(link) {
  navigator.clipboard.writeText(link).then(() => alert("Link kopiert!")).catch(() => {});
}

/* ---------- boot ---------- */
if (isConfigured) {
  try {
    firebase.initializeApp(firebaseConfig);
    dbRef = firebase.database().ref(DB_PATH);
    dbRef.on("value", snapshot => {
      const data = snapshot.val();
      const prevTab = state ? state.tab : "uebersicht";
      if (data) {
        state = { teams: data.teams || defaultTeams(), groupResults: data.groupResults || {}, koResults: data.koResults || {}, koOverrides: normalizeKoOverrides(data.koOverrides), sponsors: data.sponsors || [], archive: data.archive || {}, tab: prevTab };
      } else {
        state = { teams: defaultTeams(), groupResults: {}, koResults: {}, koOverrides: { pairings: {}, winners: {} }, sponsors: [], archive: {}, tab: prevTab };
        persist();
      }
      connStatus = "connected";
      render();
    }, () => { connStatus = "error"; render(); });
  } catch (e) {
    connStatus = "error"; render();
  }
} else {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const data = JSON.parse(saved);
      state = { teams: data.teams || defaultTeams(), groupResults: data.groupResults || {}, koResults: data.koResults || {}, koOverrides: normalizeKoOverrides(data.koOverrides), sponsors: data.sponsors || [], archive: data.archive || {}, tab: "uebersicht" };
    } else state = { teams: defaultTeams(), groupResults: {}, koResults: {}, koOverrides: { pairings: {}, winners: {} }, sponsors: [], archive: {}, tab: "uebersicht" };
  } catch (e) { state = { teams: defaultTeams(), groupResults: {}, koResults: {}, koOverrides: { pairings: {}, winners: {} }, sponsors: [], archive: {}, tab: "uebersicht" }; }
  connStatus = "local";
  render();
}

setInterval(() => {
  if (state && state.tab === "uebersicht") { overviewIndex++; sponsorIndex++; render(); }
}, 7000);
</script>
